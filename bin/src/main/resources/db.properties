# MySQL Database Configuration for Lost & Found Management System
# If MySQL credentials match, the portal connects directly to MySQL.
# If MySQL is not running or password differs, it automatically uses embedded storage.
db.url=jdbc:mysql://localhost:3306/lost_found_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
db.username=root
db.password=New@123

# Application configurations
upload.dir=uploads/items
otp.expiry.minutes=5
session.timeout.minutes=30


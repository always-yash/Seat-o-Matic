spring.application.name=Seat-o-Matic
spring.profiles.default=local
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/seatomatic;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
seatomatic.papers.buffer-copies=${PAPER_BUFFER_COPIES:2}
